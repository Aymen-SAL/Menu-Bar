<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu-Bar</title>
    <link rel="stylesheet" href="menu.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <input type="checkbox" id="menu-toggle">
    <label class="toggle" for="menu-toggle" aria-label="Toggle menu">
        <span class="top-line" common></span>
        <span class="middium-line" common></span>
        <span class="bottom-line" common></span>
    </label>
    <div class="slide">
        <h1>MENU</h1>
        <ul>
            <li><a href="#"><i class="fas fa-tv"></i>Dashboard</a></li>
            <li><a href="#"><i class="fas fa-user"></i>Profile</a></li>
            <li><a href="#"><i class="fas fa-gripfire"></i>Trading</a></li>
            <li><a href="#"><i class="fas fa-comments"></i>Messages</a></li>
            <li><a href="#"><i class="fas fa-folder"></i>File Manager</a></li>
            <li><a href="#"><i class="fas fa-address-book"></i>Portifolio</a></li>
            <li><a href="#"><i class="fas fa-heart"></i>Saved</a></li>
            <li><a href="#"><i class="fas fa-cogs"></i>Settings</a></li>
        </ul>
    </div>
</body>
</html>
